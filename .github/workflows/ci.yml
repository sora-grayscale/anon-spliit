name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

# Least privilege for GITHUB_TOKEN: every job here only reads the repo. The
# Docker smoke build's GHA cache uses the runner's ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it is unaffected. Release/publish lives in cd.yml.
permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PRISMA_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      POSTGRES_URL_NON_POOLING: 'postgresql://dummy:dummy@localhost:5432/dummy'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Check TypeScript types
        run: pnpm tsc --noEmit

      - name: Check ESLint
        run: pnpm lint

      - name: Check Prettier formatting
        run: pnpm check-formatting

  test:
    runs-on: ubuntu-latest

    env:
      POSTGRES_PRISMA_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      POSTGRES_URL_NON_POOLING: 'postgresql://dummy:dummy@localhost:5432/dummy'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run tests
        run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]

    env:
      DATABASE_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      POSTGRES_PRISMA_URL: 'postgresql://dummy:dummy@localhost:5432/dummy'
      POSTGRES_URL_NON_POOLING: 'postgresql://dummy:dummy@localhost:5432/dummy'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build

  docker-smoke-build:
    # Builds the production image the same way releases do, so a broken
    # Dockerfile (e.g. a missing COPY for a file imported by next.config.mjs)
    # fails the PR. A plain `pnpm build` does not exercise the Dockerfile.
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (single platform, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: false
          tags: anon-spliit:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
